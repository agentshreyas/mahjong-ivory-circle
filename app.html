<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Redirecting…</title></head>
<body>
<script>
  const ua = navigator.userAgent || navigator.vendor;
  if (/android/i.test(ua)) {
    location.href = "https://play.google.com/store/apps/details?id=com.mahjongcircle.app";
  } else if (/iPad|iPhone|iPod/.test(ua)) {
    location.href = "https://apps.apple.com/app/id6790778933";
  } else {
    location.href = "https://www.mahjongcircle.in/landing"; // desktop fallback
  }
</script>
<p>Redirecting to the app store…</p>
</body>
</html>
